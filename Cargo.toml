[package]
name = "lgroot"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Cross-platform LG webOS TV rooting wizard (SlopBro front-end)"
license = "AGPL-3.0-or-later"
readme = "README.md"

[dependencies]
slint = "1.18"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
sha2 = "0.10"
if-addrs = "0.15"

[build-dependencies]
slint-build = "1.18"

[[bin]]
name = "lgroot"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
